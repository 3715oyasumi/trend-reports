<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポイ活お得案件レポート 2026年8月1日</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');

    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --accent: #1f6feb;
      --text: #e6edf3;
      --muted: #8b949e;
      --link: #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      line-height: 1.8;
      padding: 24px;
      max-width: 860px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--accent);
      margin-bottom: 8px;
    }

    .report-date {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    h2 {
      font-size: 18px;
      font-weight: 700;
      padding-left: 12px;
      border-left: 3px solid var(--accent);
      margin: 32px 0 16px;
    }

    h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin: 24px 0 8px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 20px 24px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .card:hover { border-color: var(--link); }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .card-detail {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 15px;
      color: var(--text);
      margin-top: 8px;
    }

    .label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      min-width: 36px;
      text-align: right;
      flex-shrink: 0;
    }

    .card-amount {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .total-count {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .section-count {
      font-size: 13px;
      color: var(--muted);
      font-weight: 400;
      margin-left: 8px;
    }

    .card-source {
      font-size: 13px;
      color: var(--muted);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    .note {
      font-size: 13px;
      color: var(--muted);
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .empty-message {
      font-size: 15px;
      color: var(--muted);
      padding: 32px 0;
    }

    @media (max-width: 600px) {
      body { padding: 16px; }
      h1 { font-size: 20px; }
      h2 { font-size: 16px; }
      .card { padding: 16px; }
      .card-detail {
        flex-direction: column;
        gap: 2px;
      }
      .label {
        min-width: auto;
        text-align: left;
      }
      .card-amount { font-size: 15px; }
    }
  </style>
</head>
<body>
  <h1>ポイ活お得案件レポート</h1>
  <p class="report-date">2026年8月1日</p>
  <p class="total-count">本日のお得案件: 0件</p>

  <p class="empty-message">本日は対象アカウントの新規投稿がありませんでした。</p>

  <p class="note">
    ※掲載情報は確認時点のものです。最新の還元率・条件は各サイトにてご確認ください。
  </p>
</body>
</html>
