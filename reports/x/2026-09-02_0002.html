<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xツイートデータ分析レポート</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600;700&display=swap');
:root {
  --canvas: #faf9f5; --card: #fffdf8; --surface-soft: #f5f0e8;
  --hairline: #e6dfd8; --hairline-soft: #ebe6df;
  --primary: #cc785c; --primary-active: #a9583e;
  --ink: #141413; --text: #3d3d3a; --muted: #6c6a64;
  --font-display: "Noto Serif JP", Garamond, "Times New Roman", serif;
  --font-body: "Inter", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --shadow-soft: 0 1px 3px rgba(20,20,19,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--canvas); color: var(--text);
  font-family: var(--font-body);
  line-height: 1.75; padding: 40px 20px 64px; max-width: 760px; margin: 0 auto;
  -webkit-font-smoothing: antialiased;
}
.report-header {
  background: var(--card); border: 1px solid var(--hairline); border-radius: 16px;
  padding: 28px; margin-bottom: 32px; box-shadow: var(--shadow-soft);
}
.report-label {
  font-family: var(--font-body); font-size: 11px;
  color: var(--muted); letter-spacing: 2px; margin-bottom: 10px;
}
.report-title {
  font-family: var(--font-display); font-size: 28px; font-weight: 700;
  color: var(--ink); line-height: 1.3; letter-spacing: -0.01em; text-wrap: balance;
  margin-bottom: 16px;
}
.report-meta { display: flex; flex-wrap: wrap; gap: 16px; }
.meta-item { font-size: 14px; color: var(--muted); }
.meta-item span { color: var(--text); font-weight: 600; }
.report-section { margin-bottom: 24px; }
.section-title {
  font-family: var(--font-display); font-size: 20px; font-weight: 600;
  color: var(--ink); line-height: 1.4; text-wrap: balance;
  padding-left: 14px; border-left: 3px solid var(--primary); margin: 32px 0 14px;
}
.section-num { font-size: 13px; color: var(--muted); }
.item-card {
  background: var(--card); border: 1px solid var(--hairline);
  border-radius: 12px; padding: 18px 20px; margin-bottom: 10px;
  box-shadow: var(--shadow-soft); transition: border-color 0.2s, box-shadow 0.2s;
}
.item-card:hover { border-color: var(--primary); box-shadow: 0 4px 14px rgba(20,20,19,0.08); }
.item-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.item-title { font-weight: 700; font-size: 15px; color: var(--ink); flex: 1; line-height: 1.5; }
.item-desc { font-size: 14px; color: var(--text); margin-bottom: 8px; line-height: 1.7; }
.item-desc strong { color: var(--ink); }
.item-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 2px 10px; border-radius: 9999px; }
.tag-user  { background: var(--surface-soft); color: var(--primary-active); border: 1px solid var(--hairline); }
.tag-stat  { background: var(--surface-soft); color: var(--muted); border: 1px solid var(--hairline); }
.badge { font-size: 11px; padding: 2px 10px; border-radius: 9999px; font-weight: 600; white-space: nowrap; border: 1px solid var(--hairline); }
.badge-danger  { background: #fbeae5; color: #a9583e; border-color: #e6cabd; }
.badge-warning { background: #f6efe2; color: #8a6d2f; border-color: #e6dcc4; }
.badge-info    { background: #f5f0e8; color: #6c6a64; border-color: var(--hairline); }
.summary-table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--card); border: 1px solid var(--hairline); border-radius: 12px; overflow: hidden; }
.summary-table th {
  background: var(--surface-soft); padding: 10px 14px; text-align: left;
  color: var(--muted); border-bottom: 1px solid var(--hairline);
}
.summary-table td { padding: 10px 14px; border-bottom: 1px solid var(--hairline-soft); color: var(--text); }
hr { border: none; border-top: 1px solid var(--hairline); margin: 32px 0; }
@media (max-width: 600px) {
  body { padding: 24px 16px 48px; }
  .report-title { font-size: 23px; }
  .section-title { font-size: 18px; }
}
</style>
</head>
<body>
  <div class="report-header">
    <div class="report-label">X TWEET DATA ANALYSIS REPORT</div>
    <h1 class="report-title">Xツイートデータ分析レポート</h1>
    <div class="report-meta">
      <div class="meta-item">📅 収集日時：<span>2026-09-02 00:02</span></div>
      <div class="meta-item">📊 対象件数：<span>1,155件</span></div>
    </div>
  </div>
  <section class="report-section">
  <h2 class="section-title">1. 人気商品・トレンド</h2>
  <div class="section-content"></div>
</section>
<section class="report-section">
  <h2 class="section-title">2. お得情報・セール</h2>
  <div class="section-content"></div>
</section>
<section class="report-section">
  <h2 class="section-title">3. 転売情報</h2>
  <div class="section-content"></div>
</section>
<section class="report-section">
  <h2 class="section-title">4. 抽選・限定販売</h2>
  <div class="section-content"></div>
</section>
<section class="report-section">
  <h2 class="section-title">5. サクセス報告</h2>
  <div class="section-content"></div>
</section>
<section class="report-section">
  <h2 class="section-title">6. プレ値情報</h2>
  <div class="section-content"></div>
</section>
<section class="report-section">
  <h2 class="section-title">7. 入荷・再販情報</h2>
  <div class="section-content"></div>
</section>
<section class="report-section">
  <h2 class="section-title">8. 注意・警告</h2>
  <div class="section-content"></div>
</section>

</body>
</html>
