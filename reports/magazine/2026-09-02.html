<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本日の雑誌・付録情報</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600;700&display=swap');

    :root {
      --canvas: #faf9f5;
      --card: #fffdf8;
      --surface-soft: #f5f0e8;
      --hairline: #e6dfd8;
      --hairline-soft: #ebe6df;
      --primary: #cc785c;
      --primary-active: #a9583e;
      --ink: #141413;
      --text: #3d3d3a;
      --muted: #6c6a64;
      --font-display: "Noto Serif JP", Garamond, "Times New Roman", serif;
      --font-body: "Inter", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --shadow-soft: 0 1px 3px rgba(20, 20, 19, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--canvas);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.75;
      padding: 40px 24px 64px;
      max-width: 760px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
      letter-spacing: -0.01em;
      text-wrap: balance;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--primary);
      margin-bottom: 8px;
    }

    .report-date {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .total-count {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 40px;
    }

    h2 {
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.4;
      text-wrap: balance;
      padding-left: 14px;
      border-left: 3px solid var(--primary);
      margin: 40px 0 16px;
    }

    h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      margin: 24px 0 8px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--hairline);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-soft);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover { border-color: var(--primary); box-shadow: 0 4px 14px rgba(20, 20, 19, 0.08); }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .card-detail {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 15px;
      color: var(--text);
      margin-top: 8px;
    }

    .label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      min-width: 40px;
      text-align: right;
      flex-shrink: 0;
    }

    .card-amount {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary-active);
    }

    .total-count { }

    .section-count {
      font-size: 13px;
      color: var(--muted);
      font-weight: 400;
      margin-left: 8px;
      font-family: var(--font-body);
    }

    .card-source {
      font-size: 13px;
      color: var(--muted);
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--hairline-soft);
    }

    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 2px; }

    hr {
      border: none;
      border-top: 1px solid var(--hairline);
      margin: 40px 0;
    }

    .note {
      font-size: 13px;
      color: var(--muted);
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid var(--hairline);
    }

    @media (max-width: 600px) {
      body { padding: 24px 16px 48px; }
      h1 { font-size: 25px; }
      h2 { font-size: 19px; }
      .card { padding: 16px 18px; }
      .card-detail {
        flex-direction: column;
        gap: 2px;
      }
      .label {
        min-width: auto;
        text-align: left;
      }
      .card-amount { font-size: 16px; }
    }
  </style>
</head>
<body>
  <h1>本日の雑誌・付録情報</h1>
  <p class="report-date">2026年9月2日</p>
  <p class="total-count">本日の雑誌・付録情報: 0件</p>

  <p class="note">※価格・発売日は確認時点のものです。</p>
</body>
</html>
