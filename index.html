<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日のトレンドまとめ byエンマち</title>
  <meta name="description" content="毎日まとめたトレンド情報をレポートとしてアップしています。Xツイート分析・時事トレンド・飲食店・コンビニ・コラボカフェなど14ジャンル対応。">
  <meta property="og:title" content="今日のトレンドまとめ byエンマち">
  <meta property="og:description" content="毎日まとめたトレンド情報をレポートとしてアップしています。Xツイート分析・時事トレンド・飲食店・コンビニ・コラボカフェなど14ジャンル対応。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://trendmatome.online">
  <meta property="og:image" content="https://trendmatome.online/favicon.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@yukichina7">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZMJP999S1P"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZMJP999S1P');
  </script>
  <style>
    :root {
      --bg: #0d1117; --card: #161b22; --border: #30363d;
      --accent: #1f6feb; --text: #e6edf3; --muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif; }

    header {
      background: #0d1b2a;
      border-bottom: 1px solid var(--border);
      padding: 24px;
      display: flex; align-items: center; gap: 16px;
    }
    header img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    header .header-text h1 { font-size: 22px; font-weight: 700; }
    header .header-text p { font-size: 13px; color: var(--muted); margin-top: 8px; }

    .tabs {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      background: #0d1117; position: sticky; top: 0; z-index: 10;
    }
    .tab {
      padding: 8px 16px; border-radius: 4px; font-size: 13px; cursor: pointer;
      border: 1px solid var(--border); background: var(--card); color: var(--muted);
      transition: border-color 0.2s, color 0.2s;
    }
    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active { background: rgba(31, 111, 235, 0.15); border-color: var(--accent); color: #58a6ff; }

    .content { padding: 24px; max-width: 900px; margin: 0 auto; }

    .genre-section { display: none; }
    .genre-section.active { display: block; }

    .report-list { display: flex; flex-direction: column; gap: 8px; }
    .report-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 4px; padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
    }
    .report-item { transition: border-color 0.2s; }
    .report-item:hover { border-color: #58a6ff; }
    .report-date { font-weight: 600; font-size: 16px; }
    .report-link {
      display: inline-block; padding: 8px 16px; border-radius: 4px;
      background: var(--accent); color: #fff; font-size: 13px;
      text-decoration: none; font-weight: 600;
      transition: background-color 0.2s;
    }
    .report-link:hover { background: #388bfd; }

    .empty { color: var(--muted); font-size: 14px; padding: 48px 0; text-align: center; }

    .show-more {
      display: block; width: 100%; margin-top: 8px; padding: 12px;
      background: none; border: 1px solid var(--border); border-radius: 4px;
      color: var(--muted); font-size: 13px; cursor: pointer;
      font-family: inherit; transition: border-color 0.2s, color 0.2s;
    }
    .show-more:hover { border-color: var(--accent); color: var(--text); }

    footer {
      text-align: center; padding: 24px; color: var(--muted);
      font-size: 12px; border-top: 1px solid var(--border); margin-top: 48px;
    }
    @media (max-width: 600px) {
      .tabs {
        padding: 12px 16px;
        position: static;
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { flex-shrink: 0; }
      .content { padding: 16px; }
    }
  </style>
</head>
<body>

<header>
  <img src="favicon.png" alt="エンマち">
  <div class="header-text">
    <h1>今日のトレンドまとめ <span style="font-size:14px; font-weight:400; color:var(--muted);">byエンマち</span></h1>
    <p>毎日まとめたトレンド情報をレポートとしてアップしています。ジャンルはタブで切り替えて下さい。</p>
    <p id="last-updated"></p>
    <a href="https://x.com/yukichina7" target="_blank" style="color:#58a6ff; font-size:13px; text-decoration:none;">𝕏 @yukichina7</a>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<div class="content" id="content"></div>

<footer>© エンマち ｜ <a href="https://x.com/yukichina7" target="_blank" style="color:#58a6ff; text-decoration:none;">@yukichina7</a></footer>

<script>
const MANIFEST_URL = 'data/manifest.json';
const PAGE_SIZE = 10;

const GENRES = [
  { key: 'x',           label: 'Xツイート分析' },
  { key: 'trend',       label: '時事トレンド' },
  { key: 'food',        label: '飲食店情報' },
  { key: 'convenience', label: 'コンビニ情報' },
  { key: 'collabocafe', label: 'コラボカフェ情報' },
  { key: 'movie',       label: '映画・エンタメ情報' },
  { key: 'magazine',    label: '雑誌・漫画情報' },
  { key: 'pointsite',   label: 'ポイントサイト情報' },
  { key: 'mobile',      label: 'MNP・モバイル情報' },
  { key: 'treca',       label: 'トレカ情報' },
  { key: 'sake',        label: 'お酒情報' },
  { key: 'tobacco',     label: 'タバコ情報' },
  { key: 'delivery',    label: 'デリバリー情報' },
  { key: 'AI',          label: 'AI情報' },
];

let manifest = {};
let activeGenre = GENRES[0].key;
let visibleCounts = {};

function formatDate(dateStr) {
  const [datePart, timePart] = dateStr.split('_');
  const [y, m, d] = datePart.split('-');
  if (timePart) {
    const h = timePart.slice(0, 2);
    const min = timePart.slice(2, 4);
    return `${y}.${m}.${d}  ${h}:${min}`;
  }
  return `${y}.${m}.${d}`;
}

function formatDateJa(dateStr) {
  const datePart = dateStr.split('_')[0];
  const [y, m, d] = datePart.split('-');
  return `${y}年${parseInt(m)}月${parseInt(d)}日`;
}

async function loadManifest() {
  try {
    const r = await fetch(MANIFEST_URL + '?t=' + Date.now());
    manifest = await r.json();
    const dates = Object.values(manifest).flatMap(v => v.map(e => e.date)).sort().reverse();
    if (dates.length) {
      document.getElementById('last-updated').textContent = `最終更新: ${formatDateJa(dates[0])}`;
    }
    render();
  } catch(e) {
    document.getElementById('last-updated').textContent = '更新情報を読み込めませんでした';
  }
}

function renderSection(g) {
  const reports = (manifest[g.key] || []).slice().reverse();
  const count = visibleCounts[g.key] || PAGE_SIZE;
  const visible = reports.slice(0, count);
  const hasMore = reports.length > count;

  if (reports.length === 0) {
    return '<div class="empty">まだレポートがありません</div>';
  }

  const items = visible.map(r => `
    <div class="report-item">
      <span class="report-date">${formatDate(r.date)}</span>
      <a class="report-link" href="${r.url}" target="_blank">レポートを見る</a>
    </div>`).join('');

  const moreBtn = hasMore
    ? `<button class="show-more" data-key="${g.key}">さらに読み込む（残り${reports.length - count}件）</button>`
    : '';

  return `<div class="report-list">${items}</div>${moreBtn}`;
}

function render() {
  const tabsEl = document.getElementById('tabs');
  const contentEl = document.getElementById('content');
  tabsEl.innerHTML = '';
  contentEl.innerHTML = '';

  GENRES.forEach(g => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (g.key === activeGenre ? ' active' : '');
    tab.textContent = g.label;
    tab.onclick = () => { activeGenre = g.key; render(); };
    tabsEl.appendChild(tab);

    const section = document.createElement('div');
    section.className = 'genre-section' + (g.key === activeGenre ? ' active' : '');
    section.innerHTML = renderSection(g);
    contentEl.appendChild(section);
  });

  contentEl.querySelectorAll('.show-more').forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.key;
      visibleCounts[key] = (visibleCounts[key] || PAGE_SIZE) + PAGE_SIZE;
      render();
    };
  });
}

loadManifest();
</script>
</body>
</html>
