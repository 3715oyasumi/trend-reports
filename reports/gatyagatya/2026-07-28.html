<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レポート</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
:root {
  --bg: #0d1117; --card: #161b22; --border: #30363d;
  --accent: #1f6feb; --text: #e6edf3; --muted: #8b949e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 16px; line-height: 1.7; padding: 24px; max-width: 860px; margin: 0 auto;
}
h1 {
  font-size: 24px; font-weight: 700; margin-bottom: 8px;
  padding-bottom: 12px; border-bottom: 2px solid var(--accent);
}
.report-date {
  font-size: 13px; color: var(--muted); margin-bottom: 24px;
}
h2 {
  font-size: 18px; font-weight: 700; margin: 32px 0 16px;
  padding-left: 12px; border-left: 3px solid var(--accent);
}
h3 { font-size: 16px; font-weight: 700; margin: 24px 0 8px; color: var(--text); }
ul { list-style: none; padding: 0; margin: 0; }
ul li {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 4px; padding: 16px 24px; margin-bottom: 8px;
  transition: border-color 0.2s;
}
ul li:hover { border-color: #58a6ff; }
ul ul { margin-top: 8px; margin-left: 0; }
ul ul li {
  background: #0d1117; border-color: #21262d;
  padding: 8px 16px; font-size: 14px; color: var(--muted);
}
ul ul li:hover { border-color: #30363d; }
p { margin-bottom: 8px; font-size: 16px; }
a { color: #58a6ff; text-decoration: none; }
a:hover { text-decoration: underline; }
strong { color: #fff; }
hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 16px 0; }
th { background: #1c2128; padding: 10px 16px; text-align: left; color: var(--muted); border-bottom: 2px solid var(--border); }
td { padding: 10px 16px; border-bottom: 1px solid var(--border); }
tr:hover td { background: #1c2128; }
blockquote { border-left: 3px solid var(--accent); padding-left: 16px; color: var(--muted); margin: 16px 0; }
code { background: #1c2128; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }
@media (max-width: 600px) { body { padding: 16px; } h1 { font-size: 20px; } h2 { font-size: 16px; } }
</style>
</head>
<body>
<p>本日は対象アカウントの新規投稿がありませんでした。</p>
</body>
</html>
